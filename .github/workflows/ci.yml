name: CI

on:
  push:
    branches: [ "main", "dev/**" ]
  pull_request:
    branches: [ "main", "dev/**" ]

jobs:
  test:
    name: Test & Audit (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run installer test suite
        run: npm test

      - name: Run V.E.R. self-audit
        run: node bin/ver.js --check .

      - name: Run test coverage
        run: npm run test:coverage

      - name: Check coverage threshold
        run: |
          node -e "
            const { execSync } = require('child_process');
            const output = execSync('npm run test:coverage', { encoding: 'utf8' });
            process.stdout.write(output);
            const match = output.match(/all files\s*\|\s*([\d.]+)/);
            if (!match) { console.error('❌ Could not parse coverage report'); process.exit(1); }
            const coverage = parseFloat(match[1]);
            const threshold = 90;
            if (coverage < threshold) {
              console.error('❌ Coverage threshold check failed: Current coverage is ' + coverage + '% (minimum required: ' + threshold + '%)');
              process.exit(1);
            }
            console.log('✅ Coverage threshold check passed: Current coverage is ' + coverage + '% (minimum required: ' + threshold + '%)');
          "
